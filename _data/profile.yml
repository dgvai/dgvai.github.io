intro: >-
  Hello World!

bio:
  - >-
    I'm a Ph.D. student in Computer Science at **Kennesaw State University** and a graduate research assistant in the College of Computing and Software Engineering, advised by Dr. Lei Zhang and Dr. Yu Zhao. My research sits at the intersection of human-computer interaction and mixed reality, where I study how AI can help people understand and act within immersive environments. I earned my B.Sc. in Mechatronics Engineering from Rajshahi University of Engineering & Technology (RUET). Before my Ph.D., I spent nearly two years as a software engineer at Sazim Tech Ltd., leading projects across full-stack development, data analysis and DevOps.
  - >-
    I'm open to research internship opportunities in HCI, mixed reality, or applied AI/Computer Vision, though I'm not currently seeking full-time positions. Feel free to reach out if you think there's a fit.

